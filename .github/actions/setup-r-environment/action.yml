name: Set up R environment
description: Install R, rv and the standard or locked assessment dependencies.
inputs:
  config-file:
    description: Use rproject.toml or tests/refactor/rproject.toml.
    default: rproject.toml
  locked:
    description: Require the committed dependency lock without updating it.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Select tool versions
      id: versions
      shell: bash
      run: |
        echo "r_version=4.5.2" >> "$GITHUB_OUTPUT"
        echo "rv_version=0.22.2" >> "$GITHUB_OUTPUT"

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ steps.versions.outputs.r_version }}

    - name: Install rv (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        RV_VERSION: ${{ steps.versions.outputs.rv_version }}
      run: |
        mkdir -p "$RUNNER_TEMP/rv-bin"
        curl -fsSL \
          "https://github.com/A2-ai/rv/releases/download/v${RV_VERSION}/rv-v${RV_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          -o "$RUNNER_TEMP/rv.tar.gz"
        echo "9805dbad14eb049265c0052635873c9b7891bc7334d445662c13fbad61cb269c  $RUNNER_TEMP/rv.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/rv.tar.gz" -C "$RUNNER_TEMP/rv-bin"
        echo "$RUNNER_TEMP/rv-bin" >> "$GITHUB_PATH"

    - name: Install rv (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        RV_VERSION: ${{ steps.versions.outputs.rv_version }}
      run: |
        mkdir -p "$RUNNER_TEMP/rv-bin"
        curl -fsSL \
          "https://github.com/A2-ai/rv/releases/download/v${RV_VERSION}/rv-v${RV_VERSION}-aarch64-apple-darwin.tar.gz" \
          -o "$RUNNER_TEMP/rv.tar.gz"
        echo "626e3205a123bbb275017799e63a1548dcd7b8f42f37d09b8df57f9956ecf956  $RUNNER_TEMP/rv.tar.gz" | shasum -a 256 --check
        tar -xzf "$RUNNER_TEMP/rv.tar.gz" -C "$RUNNER_TEMP/rv-bin"
        echo "$RUNNER_TEMP/rv-bin" >> "$GITHUB_PATH"

    - name: Install rv (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        RV_VERSION: ${{ steps.versions.outputs.rv_version }}
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "rv.zip"
        $bin = Join-Path $env:RUNNER_TEMP "rv-bin"
        Invoke-WebRequest `
          -Uri "https://github.com/A2-ai/rv/releases/download/v$env:RV_VERSION/rv-v$env:RV_VERSION-x86_64-pc-windows-msvc.zip" `
          -OutFile $archive
        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
        if ($actual -ne "8adc0d558e0459e58eb88a770082211bcb1e23c2efc1f6ba5da3d5a9ba39877c") {
          throw "rv archive checksum mismatch: $actual"
        }
        Expand-Archive -Path $archive -DestinationPath $bin
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Restore R package library
      uses: actions/cache@v6
      with:
        path: ${{ inputs.config-file == 'rproject.toml' && 'rv/library' || 'tests/refactor/rv/library' }}
        key: ${{ inputs.config-file == 'rproject.toml' && 'rv' || 'rv-refactor' }}-${{ steps.versions.outputs.rv_version }}-${{ runner.os }}-${{ runner.arch }}-r-${{ steps.versions.outputs.r_version }}-${{ inputs.config-file == 'rproject.toml' && hashFiles('rproject.toml') || hashFiles('tests/refactor/rproject.toml', 'tests/refactor/rv.lock') }}

    - name: Install system dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        RV_CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        sudo apt-get update
        rv --config-file "$RV_CONFIG_FILE" sysdeps --only-absent | xargs --no-run-if-empty sudo apt-get install -y

    - name: Sync R dependencies (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        RV_CONFIG_FILE: ${{ inputs.config-file }}
        RV_LOCKED: ${{ inputs.locked }}
      run: |
        args=(--config-file "$RV_CONFIG_FILE" sync)
        if [[ "$RV_LOCKED" == 'true' ]]; then args+=(--locked); fi
        rv "${args[@]}"

    - name: Sync R dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        RV_CONFIG_FILE: ${{ inputs.config-file }}
        RV_LOCKED: ${{ inputs.locked }}
      run: |
        $arguments = @('--config-file', $env:RV_CONFIG_FILE, 'sync')
        if ($env:RV_LOCKED -eq 'true') { $arguments += '--locked' }
        rv.exe @arguments
